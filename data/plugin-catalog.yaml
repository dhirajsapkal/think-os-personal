# catalog_lint: any entry with url_verified: false must NOT appear in a preset.
# =============================================================================
# Think OS Plugin / Connector Catalog
# =============================================================================
# Single source of truth for the CC installer and the Cowork wizard.
#
# Schema overview:
#   catalog  — list of plugin/connector entries (see field docs below)
#   presets  — named bundles of catalog ids used by the setup wizards
#
# Catalog entry fields:
#   id          string   Stable lowercase slug; primary key.
#   name        string   Human-readable display name.
#   category    string   One of: communication | docs | tracker | meetings |
#                          design | crm_analytics | finance | calendar | skills_bundle
#   oauth       bool     User must complete OAuth after install.
#   cowork      map      Present only when the item is installable in Cowork.
#     available   bool
#     kind        string  connector | plugin
#     registry_id string  Id passed to mcp__mcp-registry__suggest_connectors or
#                          mcp__plugins__suggest_plugin_install
#   claude_code map      Present only when the item is installable from CC CLI.
#     available    bool
#     kind         string  mcp_remote | mcp_stdio | plugin | skill_bundle
#     bridge_match string  Optional. Display name that appears after "claude.ai "
#                           in `claude mcp list` when the service is provided by
#                           Claude Code's claude.ai marketplace bridge (i.e. the
#                           user signed into claude.ai and enabled the connector
#                           there). When set, the installer will detect the
#                           bridge entry and report status BRIDGE instead of
#                           attempting a local `claude mcp add` that would
#                           duplicate auth and never converge. Leave unset for
#                           items that have no claude.ai equivalent.
#     requires_bridge bool Optional, defaults false. Set true when the vendor's
#                           MCP endpoint does NOT support RFC 7591 Dynamic Client
#                           Registration and therefore can't be locally installed
#                           via Claude Code's `mcp add` path (it requires a
#                           pre-registered OAuth client tied to a specific App).
#                           When true AND the bridge isn't detected, the installer
#                           prints a REQUIRES BRIDGE message instead of attempting
#                           a doomed local registration. Confirmed: slack. Audit
#                           each entry case-by-case — only set when confirmed via
#                           a failed local OAuth attempt.
#     # mcp_remote fields:
#     transport    string  http | sse
#     url          string  MCP server URL
#     mcp_name     string  Name passed to `claude mcp add <name>`
#     # mcp_stdio fields:
#     command      string  Executable to run (e.g. uvx, npx)
#     args         list    Optional extra arguments
#     mcp_name     string  Name passed to `claude mcp add <name>`
#     # plugin / skill_bundle fields:
#     marketplace  string  e.g. anthropics/knowledge-work-plugins
#     plugin       string  Plugin slug within that marketplace
#   notes       string   Free-form human notes shown during setup.
# =============================================================================

catalog:

