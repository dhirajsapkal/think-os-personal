# =============================================================================
# Think OS Plugin / Connector Catalog
# =============================================================================
# Single source of truth for the Claude Code installer.
#
# Schema overview:
#   catalog  — list of plugin/connector entries (see field docs below)
#   presets  — named bundles of catalog ids used by the installer
#
# Catalog entry fields:
#   id          string   Stable lowercase slug; primary key.
#   name        string   Human-readable display name.
#   category    string   One of: communication | docs | tracker | meetings |
#                          design | crm_analytics | finance | calendar | skills_bundle
#   oauth       bool     User must complete OAuth after install.
#   claude_code map      Present only when the item is installable from CC CLI.
#     available   bool
#     kind        string  mcp_remote | mcp_stdio | plugin | skill_bundle
#     # mcp_remote fields:
#     transport   string  http | sse
#     url         string  MCP server URL
#     mcp_name    string  Name passed to `claude mcp add <name>`
#     # mcp_stdio fields:
#     command     string  Executable to run (e.g. uvx, npx)
#     args        list    Optional extra arguments
#     mcp_name    string  Name passed to `claude mcp add <name>`
#     # plugin / skill_bundle fields:
#     marketplace string  e.g. anthropics/knowledge-work-plugins
#     plugin      string  Plugin slug within that marketplace
#   notes       string   Free-form human notes shown during setup.
# =============================================================================

catalog:

  # ---------------------------------------------------------------------------
  # Communication
  # ---------------------------------------------------------------------------

  - id: slack
    name: Slack
    category: communication
    oauth: true
    claude_code:
      available: true
